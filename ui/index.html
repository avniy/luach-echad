<script>
// The look is set before anything is drawn, so a dark screen never flashes light first.
// "auto" follows the computer's own setting; the person's choice is kept in this browser only.
(function () {
  let pick = "auto";
  try { pick = localStorage.getItem("theme") || "auto"; } catch (e) {}
  const q = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  const apply = () => {
    const dark = pick === "dark" || (pick === "auto" && q && q.matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dark ? "#17140f" : "#fbf6ec";
  };
  window.THEME = { get: () => pick, set: (v) => { pick = v; try { localStorage.setItem("theme", v); } catch (e) {} apply(); } };
  if (q && q.addEventListener) q.addEventListener("change", () => pick === "auto" && apply());
  apply();
})();
</script>

      h("div", { class: "muted" }, tx("מי שנכנס בקישור בוחר שם, רואה את כל המודעות, מסמן מועדפות וכותב הערות. לא יכול לסנכרן, לשנות את החיפוש או להזמין אחרים.")),
      h("button", { class: "btn pop", style: "margin-top:8px", onclick: make(`profiles/${P.id}/invite`, out, (r) => tx`קישור חד-פעמי, תקף ${r.days} ימים. עובד כשהמכשיר ברשת הביתית.`) }, tx("קישור הזמנה חדש")), out),
    h("div", { class: "dsec" }, h("h4", {}, tx("לחבר עוד מכשיר שלי")),
      h("div", { class: "muted" }, tx("הטלפון שלך נכנס בתור ") + ME.name + tx(", עם אותם סימונים והערות.")),
      h("button", { class: "btn", style: "margin-top:8px", onclick: make("me/attach", mine, (r) => tx`קישור חד-פעמי, תקף ${r.minutes} דקות.`) }, tx("קישור למכשיר שלי")), mine),
    h("div", { class: "dsec" }, h("h4", {}, tx("השם שלי")), h("div", { class: "row2", style: "gap:6px" },
      h("input", { type: "text", value: ME.name, id: "myname" }), h("button", { class: "btn ghost", onclick: async () => { try { await api("me/name", { name: document.getElementById("myname").value }); ME = await api("me"); P = await api("profiles/" + P.id); draw(); shareDialog(); } catch (e) { toast(e.message); } } }, tx("שמירה")))),
    h("div", { class: "muted", style: "font-size:12px" }, tx("מודעה בודדת משתפים מתוך המודעה עצמה (🔗). האפליקציה פרטית: בלי קישור אי אפשר לראות דבר.")));
}

async function board(pid, refit) {
  P = await api("profiles/" + pid);
  const s = ME.owner ? await api("sync?for=" + pid) : { running: false };
  if (s.running && (s.profile === pid || s.profile === P.store)) return syncing(pid, P.name);
  $root.replaceChildren(h("div", { class: "app" },
    h("div", { class: "top" }, logo(),
      h("span", { class: "who" }, P.name, h("span", { class: "deal" }, SALE() ? tx("🏡 קנייה") : tx("🔑 השכרה"))),
      h("span", { class: "stat" }),
      h("button", { class: "btn ghost chgbtn", onclick: () => changesDialog(), title: tx("מה נוסף, מה ירד ומה השתנה בכל סנכרון") }, tx("🔄 מה השתנה")),
      h("span", { class: "grow" }),
      // A board that is not answering as it should stays here, with the way to fix it, until it works again.
      ME.owner && Object.entries(P.board_state || {}).filter(([, st]) => !st.ok).map(([b, st]) => h("span", { class: "alert", title: st.detail || "" },
        h("a", { target: "_blank", rel: "noopener", href: P.fix_url[b] }, "⚠️ " + META.boards[b] + ": " + (st.why === "human" ? tx("מבקש אימות אנושי, לפתוח ולעבור")
          : st.why === "login" ? (st.worked_before ? tx("ההתחברות הפסיקה לעבוד, להתחבר שוב") : tx("בלי התחברות רק 20 מודעות, להתחבר"))
          : tx("לא ענה בסנכרון האחרון")) + " ↗"),
        st.why === "human" && !st.retry && h("button", { title: tx("אחרי שעברת את הבדיקה באתר של הלוח"),
          onclick: async (e) => { try { await api(`boards/${b}/retry`, {}); e.target.textContent = tx("ננסה בסנכרון הבא"); e.target.disabled = true; } catch (err) { toast(err.message); } } }, tx("פתרתי")))),
      h("button", { class: "btn ghost people", onclick: shareDialog, title: tx("מי בחיפוש, הזמנות, מכשירים") }, P.people.map((x) => h("span", { class: "bub" + (x.id === ME.person ? " me" : "") }, x.name[0])), tx(" שיתוף")),
      ME.owner && h("button", { class: "btn ghost", onclick: pasteDialog, title: tx("להוסיף מודעה שראיתם במקום אחר: מדביקים את הטקסט שלה") }, tx("＋ מודעה")),
      ME.owner && h("button", { class: "btn ghost", onclick: () => go(`#/p/${pid}/edit`) }, tx("עריכה")),
      ME.owner && h("button", { class: "btn pop", onclick: async () => { try { const q = await api(`profiles/${pid}/sync`, {}); if (q.fresh) toast(tx`המודעות של העיר נקראו לפני ${Math.max(1, Math.round(P.shared.age_hours))} שעות. נקראות שוב כל ${P.shared.fresh_hours} שעות`); else syncing(pid, P.name); } catch (e) { toast(e.message); } } }, P.shared ? tx("רענון העיר") : tx("סנכרון"))),
    extNote(),
    h("div", { class: "bar" }), h("div", { class: "panelwrap" }),
    h("div", { class: "main" + (SALE() ? " sale" : "") }, h("div", { class: "list enter" }), h("div", { class: "frame" }, h("div", { class: "tape" }, tx("המפה של ") + P.name), h("div", { id: "map" }), h("div", { class: "layers" })))));
  map = L.map("map", { zoomControl: false, attributionControl: true }).setView([P.city.lat || 32.08, P.city.lon || 34.88], 14);
  L.control.zoom({ position: "bottomleft" }).addTo(map);
  ground(map, "© OpenStreetMap");
  setTimeout(() => document.querySelector(".list")?.classList.remove("enter"), 1400);   // the rows come in once, not on every filter
  for (const c of P.centers) {
    L.circle([c.lat, c.lon], { radius: P.prefs.radius_km * 1000, color: "#ff6542", weight: 1.5, dashArray: "6 6", fillOpacity: 0.04 }).addTo(map);
    L.circle([c.lat, c.lon], { radius: 450, color: "#ff6542", weight: 0, fillOpacity: 0.1 }).addTo(map);
  }
  poiLayer = L.layerGroup().addTo(map);
  nearLayer = L.layerGroup().addTo(map);
  layer = L.layerGroup().addTo(map);
  openId = null;
  draw();
  drawPlaces();
  if (P.places == null && !refit && ME.owner) api(`profiles/${pid}/places`, {}).then(() => { if (location.hash === "#/p/" + pid) board(pid, true); }).catch((e) => toast(e.message));   // only if the person is still on this board
  const pts = visibleAds().filter((a) => a.lat).map((a) => [a.lat, a.lon]);
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
}

// ---------- coming in from a link ----------
function plain(...kids) { $root.replaceChildren(h("div", { class: "center" }, logo(), h("div", { class: "wiz" }, ...kids))); }
async function join(token) {
  let info;
  try { info = await api("link/" + token); } catch (e) { return plain(h("h2", {}, tx("הקישור לא עובד")), h("div", { class: "muted" }, tx("הוא חד-פעמי, ואולי כבר נעשה בו שימוש או שפג תוקפו. בקשו קישור חדש."))); }
  const enter = async (name) => {
    try { const r = await api("join", { token, name }); ME = await api("me"); go(r.profile ? "#/p/" + r.profile : "#/"); }
    catch (e) { toast(e.message, 8000); }
  };
  if (info.kind === "attach" || ME.person) {
    return plain(h("h2", {}, info.kind === "attach" ? tx`לחבר את המכשיר הזה בתור ${info.person_name}?` : tx`להצטרף לחיפוש "${info.profile_name}"?`),
      h("div", { class: "muted" }, info.kind === "attach" ? tx("המכשיר יישאר מחובר 90 יום.") : tx`בתור ${ME.name}.`),
      h("div", { class: "wnav" }, h("span"), h("button", { class: "btn pop", onclick: () => enter(null) }, tx("כן, להיכנס"))));
  }
  const name = h("input", { type: "text", placeholder: tx("השם שלך"), style: "width:100%;font-size:17px" });
  plain(h("h2", {}, tx`${info.by} מזמין אותך לחפש דירה יחד`), h("div", { class: "muted" }, tx`החיפוש: ${info.profile_name}. תראו את אותן מודעות, תסמנו מועדפות ותכתבו הערות זה לזה.`),
    h("div", { class: "q" }, h("label", {}, tx("איך לקרוא לך?")), name),
    h("div", { class: "wnav" }, h("span"), h("button", { class: "btn pop", onclick: () => name.value.trim() ? enter(name.value) : name.focus() }, tx("להיכנס"))));
  name.focus();
}
async function sharedAd(token) {
  let r;
  try { r = await api("shared/" + token); } catch (e) { return plain(h("h2", {}, tx("המודעה לא זמינה")), h("div", { class: "muted" }, e.message)); }
  P = { id: null, prefs: { hoods: [], deal: r.deal }, ads: [r.ad], kinds: META.kinds };
  $root.replaceChildren(h("div", { class: "center", style: "max-width:none;padding:14px 18px 0" }, logo(), h("div", { class: "muted", style: "margin-top:4px" }, tx`${r.by || tx("מישהו")} שיתף איתך מודעה אחת`)));
  modal(r.ad, { readonly: true, hoods: false });
}

async function route() {
  clearInterval(pollT);
  closeModal();
  document.getElementById("dlg")?.remove();
  if (!META) {
    META = await api("meta");
    // a place's name in the language of the screen, wherever it is shown (the ads' own words stay as written)
    if (DICT) for (const c of META.cities) { if (c.en && DICT[c.name] === undefined) DICT[c.name] = c.en; for (const n of c.hoods || []) if (n.en && DICT[n.name] === undefined) DICT[n.name] = n.en; }
  }
  ME = await api("me");
  const [, a, b, c] = location.hash.split("/");
  try {
    if (a === "join" && b) return await join(b);
    if (a === "ad" && b) return await sharedAd(b);
    if (!ME.person) return plain(h("h2", {}, tx("האפליקציה פרטית")), h("div", { class: "muted" }, tx("כדי להיכנס צריך קישור הזמנה ממי שמריץ אותה. בלי קישור אי אפשר לראות כאן דבר.")));
    if (a === "new" && ME.owner) wizard();
    else if (a === "p" && c === "edit" && ME.owner) wizard(await api("profiles/" + b));
    else if (a === "p" && b) await board(b);
    else await home();
    footState();
    if (ME.owner && !termsSeen() && !termsDialog.shown) { termsDialog.shown = true; termsDialog(true); }
    else if (!a || (a === "p" && c !== "edit")) offerUpdate();
    if (ME.owner && ME.local && !ME.update && !route.asked) {
      // The app asks about a newer version as it starts; a page opened in that same second asks once more.
      route.asked = true;
      setTimeout(async () => { try { const me = await api("me"); if (me.update) { ME.update = me.update; footState(); offerUpdate(); } } catch (e) { /* later */ } }, 5000);
    }
    let fresh = "";
    try { fresh = sessionStorage.getItem("updated") || ""; sessionStorage.removeItem("updated"); } catch (e) { /* no storage */ }
    if (fresh) toast(tx`עודכן לגרסה ${fresh}`, 7000);
  } catch (e) { toast(e.message); if (a) go("#/"); }
}
window.addEventListener("hashchange", route);
route();
</script>
