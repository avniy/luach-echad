<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח אחד</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#fbf6ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --paper: #fbf6ec; --card: #fffdf8; --ink: #24201a; --soft: #7b7466; --line: #e9e0cf; --coral: #ff6542;
          --mint: #149e74; --mint-soft: #dcf3ea; --sun: #b97a06; --sun-soft: #fdeecb; --red: #b23a2e; --red-soft: #f9e2de;
          --sky: #2f6fe0; --sky-soft: #e2ecfd; --pop: 3px 3px 0 var(--ink); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 14.5px/1.45 Rubik, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  /* The page is a column: the screen, then the footer. The board screen fills the window exactly and scrolls inside. */
  #root { flex: 1 0 auto; display: flex; flex-direction: column; } body:has(.app) #root { flex: 1 1 0; min-height: 0; }
  .foot { order: 99; flex: none; display: flex; gap: 14px; justify-content: center; align-items: center; padding: 5px 18px 9px; font-size: 12.5px; color: var(--soft); }
  .foot a { color: inherit; font-weight: 600; text-decoration: none; } .foot a:hover { color: var(--ink); }
  .foot a.treat { color: var(--ink); background: #ffe08a; border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 12px; box-shadow: 2px 2px 0 var(--ink); }
  .foot a.treat:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .btn { border: 1.5px solid var(--ink); background: var(--card); border-radius: 999px; padding: 7px 16px; font-weight: 600; }
  .btn.pop { background: var(--coral); color: #fff; box-shadow: var(--pop); transition: transform .08s, box-shadow .08s; }
  .btn.pop:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.ghost { border-color: var(--line); font-weight: 500; }
  .btn:disabled { opacity: .5; cursor: default; }
  .logo { font-weight: 800; font-size: 21px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .logo i { width: 22px; height: 22px; border-radius: 7px; background: var(--coral); border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); display: block; transform: rotate(-8deg); }
  .muted { color: var(--soft); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #f1eadb; color: #564f42; white-space: nowrap; }
  .chip.good { background: var(--mint-soft); color: var(--mint); font-weight: 600; }
  .chip.warn { background: var(--sun-soft); color: var(--sun); font-weight: 600; }
  .chip.bad { background: var(--red-soft); color: var(--red); font-weight: 600; }
  .chip.new { background: var(--coral); color: #fff; font-weight: 600; }
  .chip.b-yad2 { background: #ffe9d6; color: #b3530a; font-weight: 600; }
  .chip.b-madlan { background: var(--sky-soft); color: var(--sky); font-weight: 600; }
  .chip.b-komo { background: #efe4fb; color: #6b3fb5; font-weight: 600; }
  .chip.b-homeless { background: #e2f1e5; color: #2c7a43; font-weight: 600; }
  .chip i { font-style: normal; font-size: 11px; line-height: 1; }
  .chip.time { background: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--soft); }
  .chip.deal { background: var(--ink); color: #fff; font-weight: 600; vertical-align: middle; }
  .chips-end { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; margin-inline-start: auto; }
  .top a.chip { text-decoration: none; cursor: pointer; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); padding: 2px; gap: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .seg button.on { background: var(--ink); color: #fff; font-weight: 600; }
  input[type=text], input[type=number], input[type=search], select, textarea { border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); padding: 7px 10px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--ink); }

  /* home + wizard */
  .center { max-width: 880px; margin: 0 auto; padding: 34px 20px 60px; }
  .hero { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin: 26px 0 6px; }
  .hero em { font-style: normal; background: linear-gradient(transparent 62%, #ffd2c6 62%); }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 26px; }
  .pcard { background: var(--card); border: 1.5px solid var(--ink); border-radius: 18px; padding: 16px; box-shadow: var(--pop); cursor: pointer; transition: transform .1s; }
  .pcard:hover { transform: translate(-1px, -2px); }
  .pcard h3 { margin: 0 0 4px; font-size: 19px; }
  .pcard .big { font-size: 26px; font-weight: 800; color: var(--coral); }
  .pcard.add { border-style: dashed; box-shadow: none; display: grid; place-items: center; color: var(--soft); min-height: 130px; font-weight: 600; }
  .wiz { background: var(--card); border: 1.5px solid var(--ink); border-radius: 22px; box-shadow: var(--pop); padding: 24px 26px; margin-top: 22px; }
  .dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .dots i { height: 6px; flex: 1; border-radius: 6px; background: var(--line); }
  .dots i.on { background: var(--coral); }
  .wiz h2 { margin: 0 0 2px; font-size: 22px; }
  .q { margin-top: 16px; }
  .q > label { display: block; font-weight: 600; margin-bottom: 6px; }
  .q small { color: var(--soft); font-weight: 400; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; max-height: 168px; overflow: auto; padding: 2px; }
  .pick button { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; }
  .pick button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .pick button.must { background: var(--coral); border-color: var(--ink); color: #fff; }
  .pick button.nice { background: var(--mint-soft); border-color: var(--mint); color: var(--mint); }
  .row2 { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; } .tiles.big { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .tile { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 8px 8px; display: grid; justify-items: center; align-content: start; gap: 2px; font-size: 13.5px; text-align: center; }
  .tile:hover { border-color: var(--ink); } .tile .ti { font-size: 24px; line-height: 1.2; } .tile b { font-weight: 600; } .tile small { font-size: 11.5px; color: var(--soft); min-height: 15px; }
  .tile.on { background: var(--ink); border-color: var(--ink); color: #fff; } .tile.on small { color: #d9d2c4; }
  .tile.nice { background: var(--mint-soft); border-color: var(--mint); } .tile.nice small { color: var(--mint); font-weight: 700; }
  .tile.must { background: var(--coral); border-color: var(--ink); color: #fff; } .tile.must small { color: #fff; font-weight: 700; }
  .citysel { min-width: 240px; padding: 8px 10px; font-size: 15px; }
  .wnav { display: flex; justify-content: space-between; margin-top: 22px; } .wgo { display: flex; gap: 12px; align-items: center; } .whint { color: var(--soft); font-size: 13px; }
  .sboards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
  .sb { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 7px; align-content: start; min-height: 112px; transition: border-color .3s, opacity .3s; }
  .sb.work { border-color: var(--ink); } .sb.idle, .sb.skip { opacity: .6; } .sb.bad { border-color: var(--red); }
  .sbh { display: flex; align-items: center; gap: 8px; } .sbh .chip { font-size: 13.5px; padding: 2px 11px; } .sbs { margin-inline-start: auto; font-size: 12.5px; color: var(--soft); display: flex; gap: 6px; align-items: center; }
  .sb.done .sbs { color: var(--mint); font-weight: 600; } .sb.bad .sbs { color: var(--red); font-weight: 600; } .sbs .spin { width: 13px; height: 13px; border-width: 2px; }
  .sbm { font-size: 13.5px; min-height: 20px; } .sbc { font-size: 12.5px; color: var(--soft); min-height: 17px; }
  .sbar { height: 6px; border-radius: 6px; background: #efe8d8; overflow: hidden; } .sbar i { display: block; height: 100%; width: 0; background: var(--coral); border-radius: 6px; transition: width .6s; }
  .sb.done .sbar i { background: var(--mint); }
  @media (max-width: 700px) { .sboards { grid-template-columns: 1fr; } }
  .steps { margin-top: 18px; display: grid; gap: 8px; }
  .steps div { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 14px; animation: in .25s; }
  .steps div:last-child { border-color: var(--ink); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .spin { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--coral); border-radius: 50%; animation: sp 0.8s linear infinite; display: inline-block; vertical-align: -3px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* board */
  .app { display: flex; flex-direction: column; flex: 1; min-height: 0; } .app > * { flex: none; } .app > .main { flex: 1; }
  .top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; }
  .top .who { font-weight: 600; background: var(--card); border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
  .top .who .deal { font-weight: 500; color: var(--soft); margin-inline-start: 9px; padding-inline-start: 9px; border-inline-start: 1.5px solid var(--line); }
  .top .btn { padding: 5px 16px; }
  .alert { display: inline-flex; align-items: center; gap: 8px; background: var(--sun-soft); color: var(--sun); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 600; }
  .alert a { color: inherit; text-decoration: none; } .alert a:hover { text-decoration: underline; }
  .alert button { border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); border-radius: 999px; padding: 0 10px; font-size: 12px; font-weight: 600; margin-inline-end: -8px; }
  .top .stat { color: var(--soft); font-size: 13px; }
  .grow { flex: 1; }
  .bar { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; padding: 0 18px 10px; }
  .bar input[type=search] { width: 170px; padding: 5px 10px; border-radius: 999px; }
  .bar select { padding: 5px 8px; border-radius: 999px; font-size: 13px; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(50%, 1.15fr); gap: 16px; padding: 0 18px 16px; min-height: 0; }
  .list { overflow: auto; padding: 2px 2px 40px; display: flex; flex-direction: column; gap: 7px; }
  .frame { position: relative; background: var(--card); border: 1.5px solid var(--ink); border-radius: 20px; box-shadow: var(--pop); padding: 9px; min-height: 0; margin: 0 0 6px 4px; }
  .frame .tape { position: absolute; top: -11px; right: 26px; z-index: 500; background: #ffe08a; border: 1.5px solid var(--ink); padding: 1px 12px; font-weight: 600; font-size: 12.5px; transform: rotate(2deg); border-radius: 3px; }
  #map { height: 100%; border-radius: 13px; direction: ltr; background: #efe9dc; }
  .extnote { margin: 10px auto; max-width: 760px; padding: 10px 14px; border: 1.5px solid var(--ink); border-radius: 12px; background: #fff3cf; font-size: 14px; line-height: 1.6; }
  .extnote code { direction: ltr; unicode-bidi: embed; background: #fff; border: 1px solid #d9cfbb; border-radius: 6px; padding: 0 5px; }
  #map .leaflet-tile-pane { filter: saturate(.55) sepia(.18) brightness(1.03); }
  .pin { transform: translate(-50%, -50%); background: var(--card); border: 1.5px solid var(--ink); border-radius: 999px; padding: 0 7px; font: 600 12px Rubik, sans-serif; white-space: nowrap; box-shadow: 1.5px 1.5px 0 var(--ink); width: max-content; }
  .pin.yes { background: var(--mint); color: #fff; } .pin.maybe { background: #ffd66b; } .pin.no { background: #e6dfd0; color: #7b7466; box-shadow: none; border-color: #b9b09d; }
  .pin.hot { background: var(--coral); color: #fff; transform: translate(-50%, -50%) scale(1.25); z-index: 999; }
  .leaflet-tooltip.tw { background: var(--card); border: 1.5px solid var(--ink); border-radius: 12px; box-shadow: var(--pop); padding: 7px 9px; font: 13px Rubik, sans-serif; color: var(--ink); white-space: normal; }
  .leaflet-tooltip.tw::before { display: none; }
  .tip { display: flex; gap: 9px; align-items: center; width: max-content; max-width: 290px; }
  .tip img { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; flex: none; }
  .tip b { font-size: 15px; } .tip .l3 { margin-top: 2px; }
  .poi { transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: var(--card); border: 1.5px solid #8b8474; display: grid; place-items: center; font-size: 12px; line-height: 1; }
  .poi.hit { border-color: var(--ink); box-shadow: 1.5px 1.5px 0 var(--ink); width: 26px; height: 26px; font-size: 14px; }
  .layers { position: absolute; top: 18px; left: 18px; z-index: 500; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 62%; }
  .layers button { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; opacity: .8; }
  .layers button.on { border-color: var(--ink); opacity: 1; font-weight: 600; box-shadow: 1.5px 1.5px 0 var(--ink); }
  .ad { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; flex: none; }
  .ad.open { border-color: var(--ink); box-shadow: var(--pop); }
  .ad.gone, .ad.rejected { opacity: .62; }
  .head { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; cursor: pointer; }
  .thumb { width: 62px; height: 62px; border-radius: 10px; object-fit: cover; background: #eee7d8; display: grid; place-items: center; color: var(--soft); font-size: 11px; }
  .l1 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .list .l1 .price { min-width: 66px; } .sale .list .l1 .price { min-width: 104px; }
  .price { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .l2 { color: var(--soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .l3 { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .ring { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13.5px; position: relative; }
  .ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--card); }
  .ring span { position: relative; }
  .rich { border-top: 1.5px dashed var(--line); padding: 12px 12px 13px; display: grid; gap: 12px; animation: in .2s; }
  .gal { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
  .gal img { height: 170px; border-radius: 10px; scroll-snap-align: start; flex: none; }
  .sv { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .sv iframe { width: 100%; height: 300px; border: 1.5px solid var(--ink); border-radius: 13px; box-shadow: var(--pop); }
  .sv .btn { padding: 4px 13px; font-size: 13px; text-decoration: none; color: var(--ink); }
  .svbar { display: flex; gap: 12px; align-items: center; width: 100%; }
  .svbar a { color: var(--sky); font-weight: 600; text-decoration: none; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; }
  .sum { background: var(--mint-soft); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
  .txt { white-space: pre-line; font-size: 13.5px; }
  .box { border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 11px; font-size: 13px; }
  .box h4 { margin: 0 0 5px; font-size: 12px; letter-spacing: .04em; color: var(--soft); font-weight: 600; }
  .box + .box { margin-top: 8px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; }
  .kv.total { border-top: 1.5px solid var(--line); margin-top: 4px; padding-top: 4px; font-weight: 800; }
  .mbar { height: 8px; border-radius: 8px; background: #efe8d8; position: relative; margin: 9px 0 5px; }
  .mbar i { position: absolute; top: -4px; width: 3px; height: 16px; background: var(--soft); border-radius: 2px; left: 50%; }
  .mbar b { position: absolute; top: -5px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink); transform: translateX(-50%); }
  .why { display: flex; flex-wrap: wrap; gap: 4px; }
  .tl div { display: flex; gap: 8px; } .tl time { color: var(--soft); width: 62px; flex: none; }
  .act { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .act input { flex: 1; min-width: 150px; text-align: right; }
  .act a { color: var(--sky); font-weight: 600; text-decoration: none; white-space: nowrap; }
  .seg.st button.on.rejected { background: var(--red); } .seg.st button.on { background: var(--mint); }
  .ring.big { width: 58px; height: 58px; font-size: 19px; flex: none; }
  .ring.big::before { inset: 5px; }
  .fpanel { flex-basis: 100%; background: var(--card); border: 1.5px solid var(--ink); border-radius: 16px; box-shadow: var(--pop); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 22px; animation: in .18s; margin: 2px 4px 4px 0; }
  .fg label { display: block; font-size: 12px; color: var(--soft); font-weight: 600; margin-bottom: 5px; }
  .fpanel .pick { max-height: none; } .fpanel .pick button, .fpanel .seg button { font-size: 12.5px; padding: 3px 10px; }
  .fpanel select, .fpanel input { padding: 4px 8px; font-size: 13px; }
  #modal { position: fixed; inset: 0; z-index: 1500; background: rgba(36, 32, 26, .45); display: grid; place-items: center; padding: 22px; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } }
  .mcard { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); width: min(1120px, 100%); max-height: 100%; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; animation: in .2s; }
  .mhead { display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-bottom: 1.5px solid var(--line); background: var(--card); }
  .mprice { font-size: 27px; font-weight: 800; letter-spacing: -.02em; } .mfacts { font-size: 16px; font-weight: 500; }
  .mnav { display: flex; gap: 6px; align-items: center; flex: none; } .mnav .btn { padding: 5px 12px; }
  .media { display: grid; gap: 8px; justify-items: center; }
  .stage { position: relative; width: 100%; height: 400px; border: 1.5px solid var(--ink); border-radius: 16px; overflow: hidden; background: #1f1c17; display: flex; }
  .stage .big { flex: 1; min-width: 0; display: grid; place-items: center; } .stage .big img { max-width: 100%; max-height: 400px; object-fit: contain; display: block; }
  .stage iframe, .stage .minimap { flex: 1; border: 0; width: 100%; height: 100%; direction: ltr; }
  .stage .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--card); font-size: 20px; line-height: 1; z-index: 2; }
  .stage .nav.next { left: 12px; } .stage .nav.prev { right: 12px; }
  .stage .thumbs { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; max-width: 92%; overflow-x: auto; background: rgba(31, 28, 23, .6); padding: 5px; border-radius: 11px; }
  .stage .thumbs img { width: 46px; height: 46px; object-fit: cover; border-radius: 7px; opacity: .6; cursor: pointer; flex: none; } .stage .thumbs img.on { opacity: 1; outline: 2px solid #fff; }
  .stage .note { position: absolute; bottom: 8px; right: 10px; z-index: 600; background: var(--card); border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 11px; font-size: 12px; }
  .leaflet-tooltip.tw.small { padding: 2px 7px; font-size: 12px; border-radius: 9px; box-shadow: 1.5px 1.5px 0 var(--ink); }
  .srcwrap h4 { margin: 0 0 7px; font-size: 13px; }
  .srcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 9px; }
  .src { display: grid; gap: 1px; padding: 9px 12px; border-radius: 13px; border: 1.5px solid var(--ink); text-decoration: none; color: var(--ink); font-size: 12.5px; background: var(--card); transition: transform .1s; }
  .src:hover { transform: translateY(-2px); box-shadow: var(--pop); }

  const tabs = h("div", { class: "seg tabs" }, h("button", { class: fav ? "" : "on", onclick: () => { F.tab = "all"; draw(); } }, "כל המודעות"),
    h("button", { class: fav ? "on" : "", onclick: () => { F.tab = "fav"; draw(); } }, `♥ המועדפות שלנו${favN ? " · " + favN : ""}`));
  document.querySelector(".bar").replaceChildren(tabs, ...(fav ? [h("span", { class: "muted" }, favN ? "כל מה שמישהו בחיפוש סימן, עם ההערות של כולם" : "עוד אין מועדפות. פותחים מודעה ולוחצים ♥")] : [
    seg("fit", [["fits", "מתאימות"], ["no", "לא עוברות"], ["all", "הכל"]]),
    P.prefs.hoods.length ? seg("area", [["in", "בשכונה"], ["near", "+ קרוב"], ["all", "כל העיר"]]) : null,
    seg("status", [["todo", "לבדוק"], ["picked", "סימנתי"], ["rejected", "פסלתי"], ["all", "הכל"]]),
    h("div", { class: "seg" }, h("button", { class: F.news ? "on" : "", onclick: () => { F.news = !F.news; draw(); } }, `מה חדש${news ? " · " + news : ""}`)),
    h("div", { class: "seg" }, h("button", { class: F.panel || n ? "on" : "", onclick: () => { F.panel = !F.panel; draw(); } }, `סינון${n ? " · " + n : ""} ${F.panel ? "▴" : "▾"}`)),
    h("select", { onchange: (e) => { F.sort = e.target.value; draw(); } }, [["score", "לפי התאמה"], ["price", "הזול קודם"], ...(SALE() ? [["sqm", "הזול למ\"ר קודם"]] : []), ["fresh", "הטרי קודם"], ["near", "הקרוב קודם"]].map(([v, t]) => h("option", { value: v, selected: F.sort === v }, t))),
    h("input", { type: "search", placeholder: "רחוב, מילה...", value: F.q, onchange: (e) => { F.q = e.target.value.trim(); draw(); } }),
    h("span", { class: "muted" }, ads.length + " מודעות")]).filter(Boolean));
  document.querySelector(".panelwrap").replaceChildren(...(F.panel && !fav ? [filterPanel()] : []));
  document.querySelector(".list").replaceChildren(...(ads.length ? ads.map(fav ? favRow : row) : [h("div", { class: "empty" }, fav ? "המועדפות של כל מי שבחיפוש יופיעו כאן." : "אין מודעות שעוברות את הסינון הזה.")]));
  layer.clearLayers(); pins = {};
  for (const a of [...ads].reverse()) {
    if (!a.lat) continue;
    const el = h("div", { class: "pin " + (a.fav_by.length ? "fav " : "") + a.fit + (a.id === openId ? " hot" : "") }, (a.fav_by.length ? "♥ " : "") + (pinText(a)));
    pins[a.id] = el;
    L.marker([a.lat, a.lon], { icon: L.divIcon({ html: el, className: "", iconSize: [0, 0] }), zIndexOffset: a.score * 10 + (a.fav_by.length ? 2000 : 0) }).on("click", () => select(a.id))
      .bindTooltip(() => tip(a), { direction: "top", offset: [0, -14], className: "tw", opacity: 1 }).addTo(layer);
  }
  map.invalidateSize();
}

// ---------- sharing ----------
function dialog(title, ...kids) {
  document.getElementById("dlg")?.remove();
  const close = () => document.getElementById("dlg")?.remove();
  document.body.append(h("div", { id: "dlg", onclick: close }, h("div", { class: "dcardbox", onclick: (e) => e.stopPropagation() },
    h("div", { class: "dhead" }, h("b", {}, title), h("span", { class: "grow" }), h("button", { class: "btn", onclick: close }, "✕")), ...kids)));
}
function shareDialog() {
  const out = h("div", {}), mine = h("div", {});
  const make = (path, target, note) => async (e) => {
    e.target.disabled = true;
    try { const r = await api(path, {}); target.replaceChildren(linkBox(r.url, note(r))); } catch (err) { toast(err.message, 9000); }
    e.target.disabled = false;
  };
  dialog("מחפשים יחד: " + P.name,
    h("div", { class: "dsec" }, h("h4", {}, "מי בחיפוש הזה"), P.people.map((x) => h("div", { class: "mark" }, h("span", { class: "bub" + (x.id === ME.person ? " me" : "") }, x.name[0]),
      h("div", { style: "flex:1" }, h("b", {}, x.name + (x.id === ME.person ? " (אני)" : "")), h("span", { class: "muted" }, x.owner ? " · פתח את החיפוש" : x.seen ? " · נראה לאחרונה " + day(x.seen) : " · עוד לא נכנס")),
      ME.owner && !x.owner && h("button", { class: "btn ghost", onclick: async () => { if (!confirm(`להוציא את ${x.name} מהחיפוש? המכשירים שלו ינותקו.`)) return; await api(`profiles/${P.id}/members/${x.id}/remove`, {}); P = await api("profiles/" + P.id); shareDialog(); } }, "להוציא")))),
    ME.owner && h("div", { class: "dsec" }, h("h4", {}, "להזמין מישהו לחיפוש"),
      h("div", { class: "muted" }, "מי שנכנס בקישור בוחר שם, רואה את כל המודעות, מסמן מועדפות וכותב הערות. לא יכול לסנכרן, לשנות את החיפוש או להזמין אחרים."),
      h("button", { class: "btn pop", style: "margin-top:8px", onclick: make(`profiles/${P.id}/invite`, out, (r) => `קישור חד-פעמי, תקף ${r.days} ימים. עובד כשהמכשיר ברשת הביתית.`) }, "קישור הזמנה חדש"), out),
    h("div", { class: "dsec" }, h("h4", {}, "לחבר עוד מכשיר שלי"),
      h("div", { class: "muted" }, "הטלפון שלך נכנס בתור " + ME.name + ", עם אותם סימונים והערות."),
      h("button", { class: "btn", style: "margin-top:8px", onclick: make("me/attach", mine, (r) => `קישור חד-פעמי, תקף ${r.minutes} דקות.`) }, "קישור למכשיר שלי"), mine),
    h("div", { class: "dsec" }, h("h4", {}, "השם שלי"), h("div", { class: "row2", style: "gap:6px" },
      h("input", { type: "text", value: ME.name, id: "myname" }), h("button", { class: "btn ghost", onclick: async () => { try { await api("me/name", { name: document.getElementById("myname").value }); ME = await api("me"); P = await api("profiles/" + P.id); draw(); shareDialog(); } catch (e) { toast(e.message); } } }, "שמירה"))),
    h("div", { class: "muted", style: "font-size:12px" }, "מודעה בודדת משתפים מתוך המודעה עצמה (🔗). האפליקציה פרטית: בלי קישור אי אפשר לראות דבר."));
}

async function board(pid, refit) {
  P = await api("profiles/" + pid);
  const s = ME.owner ? await api("sync") : { running: false };
  if (s.running && s.profile === pid) return syncing(pid, P.name);
  $root.replaceChildren(h("div", { class: "app" },
    h("div", { class: "top" }, logo(),
      h("span", { class: "who" }, P.name, h("span", { class: "deal" }, SALE() ? "🏡 קנייה" : "🔑 השכרה")),
      h("span", { class: "stat" }),
      h("span", { class: "grow" }),
      // A board that is not answering as it should stays here, with the way to fix it, until it works again.
      ME.owner && Object.entries(P.board_state || {}).filter(([, st]) => !st.ok).map(([b, st]) => h("span", { class: "alert", title: st.detail || "" },
        h("a", { target: "_blank", rel: "noopener", href: P.fix_url[b] }, "⚠️ " + META.boards[b] + ": " + (st.why === "human" ? "מבקש אימות אנושי, לפתוח ולעבור"
          : st.why === "login" ? (st.worked_before ? "ההתחברות הפסיקה לעבוד, להתחבר שוב" : "בלי התחברות רק 20 מודעות, להתחבר")
          : "לא ענה בסנכרון האחרון") + " ↗"),
        st.why === "human" && !st.retry && h("button", { title: "אחרי שעברת את הבדיקה באתר של הלוח",
          onclick: async (e) => { try { await api(`boards/${b}/retry`, {}); e.target.textContent = "ננסה בסנכרון הבא"; e.target.disabled = true; } catch (err) { toast(err.message); } } }, "פתרתי"))),
      h("button", { class: "btn ghost people", onclick: shareDialog, title: "מי בחיפוש, הזמנות, מכשירים" }, P.people.map((x) => h("span", { class: "bub" + (x.id === ME.person ? " me" : "") }, x.name[0])), " שיתוף"),
      ME.owner && h("button", { class: "btn ghost", onclick: () => go(`#/p/${pid}/edit`) }, "עריכה"),
      ME.owner && h("button", { class: "btn pop", onclick: async () => { try { await api(`profiles/${pid}/sync`, {}); syncing(pid, P.name); } catch (e) { toast(e.message); } } }, "סנכרון")),
    extNote(),
    h("div", { class: "bar" }), h("div", { class: "panelwrap" }),
    h("div", { class: "main" + (SALE() ? " sale" : "") }, h("div", { class: "list" }), h("div", { class: "frame" }, h("div", { class: "tape" }, "המפה של " + P.name), h("div", { id: "map" }), h("div", { class: "layers" })))));
  map = L.map("map", { zoomControl: false, attributionControl: true }).setView([P.city.lat || 32.08, P.city.lon || 34.88], 14);
  L.control.zoom({ position: "bottomleft" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  for (const c of P.centers) {
    L.circle([c.lat, c.lon], { radius: P.prefs.radius_km * 1000, color: "#ff6542", weight: 1.5, dashArray: "6 6", fillOpacity: 0.04 }).addTo(map);
    L.circle([c.lat, c.lon], { radius: 450, color: "#ff6542", weight: 0, fillOpacity: 0.1 }).addTo(map);
  }
  poiLayer = L.layerGroup().addTo(map);
  nearLayer = L.layerGroup().addTo(map);
  layer = L.layerGroup().addTo(map);
  openId = null;
  draw();
  drawPlaces();
  if (P.places == null && !refit && ME.owner) api(`profiles/${pid}/places`, {}).then(() => board(pid, true)).catch((e) => toast(e.message));
  const pts = visibleAds().filter((a) => a.lat).map((a) => [a.lat, a.lon]);
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
}

// ---------- coming in from a link ----------
function plain(...kids) { $root.replaceChildren(h("div", { class: "center" }, logo(), h("div", { class: "wiz" }, ...kids))); }
async function join(token) {
  let info;
  try { info = await api("link/" + token); } catch (e) { return plain(h("h2", {}, "הקישור לא עובד"), h("div", { class: "muted" }, "הוא חד-פעמי, ואולי כבר נעשה בו שימוש או שפג תוקפו. בקשו קישור חדש.")); }
  const enter = async (name) => {
    try { const r = await api("join", { token, name }); ME = await api("me"); go(r.profile ? "#/p/" + r.profile : "#/"); }
    catch (e) { toast(e.message, 8000); }
  };
  if (info.kind === "attach" || ME.person) {
    return plain(h("h2", {}, info.kind === "attach" ? `לחבר את המכשיר הזה בתור ${info.person_name}?` : `להצטרף לחיפוש "${info.profile_name}"?`),
      h("div", { class: "muted" }, info.kind === "attach" ? "המכשיר יישאר מחובר 90 יום." : `בתור ${ME.name}.`),
      h("div", { class: "wnav" }, h("span"), h("button", { class: "btn pop", onclick: () => enter(null) }, "כן, להיכנס")));
  }
  const name = h("input", { type: "text", placeholder: "השם שלך", style: "width:100%;font-size:17px" });
  plain(h("h2", {}, `${info.by} מזמין אותך לחפש דירה יחד`), h("div", { class: "muted" }, `החיפוש: ${info.profile_name}. תראו את אותן מודעות, תסמנו מועדפות ותכתבו הערות זה לזה.`),
    h("div", { class: "q" }, h("label", {}, "איך לקרוא לך?"), name),
    h("div", { class: "wnav" }, h("span"), h("button", { class: "btn pop", onclick: () => name.value.trim() ? enter(name.value) : name.focus() }, "להיכנס")));
  name.focus();
}
async function sharedAd(token) {
  let r;
  try { r = await api("shared/" + token); } catch (e) { return plain(h("h2", {}, "המודעה לא זמינה"), h("div", { class: "muted" }, e.message)); }
  P = { id: null, prefs: { hoods: [], deal: r.deal }, ads: [r.ad], kinds: META.kinds };
  $root.replaceChildren(h("div", { class: "center", style: "max-width:none;padding:14px 18px 0" }, logo(), h("div", { class: "muted", style: "margin-top:4px" }, `${r.by || "מישהו"} שיתף איתך מודעה אחת`)));
  modal(r.ad, { readonly: true, hoods: false });
}

async function route() {
  clearInterval(pollT);
  closeModal();
  document.getElementById("dlg")?.remove();
  META = META || await api("meta");
  ME = await api("me");
  const [, a, b, c] = location.hash.split("/");
  try {
    if (a === "join" && b) return await join(b);
    if (a === "ad" && b) return await sharedAd(b);
    if (!ME.person) return plain(h("h2", {}, "האפליקציה פרטית"), h("div", { class: "muted" }, "כדי להיכנס צריך קישור הזמנה ממי שמריץ אותה. בלי קישור אי אפשר לראות כאן דבר."));
    if (a === "new" && ME.owner) wizard();
    else if (a === "p" && c === "edit" && ME.owner) wizard(await api("profiles/" + b));
    else if (a === "p" && b) await board(b);
    else await home();
  } catch (e) { toast(e.message); if (a) go("#/"); }
}
window.addEventListener("hashchange", route);
route();
</script>
